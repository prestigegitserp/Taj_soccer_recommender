name: IDSSE real-data network smoke
on:
  workflow_dispatch:
  push:
    paths:
      - "src/taj/ingest.py"
      - "scripts/integration_smoke.py"
      - ".github/workflows/integration.yml"
jobs:
  idsse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: pip install -e .
      - name: Read 60 real IDSSE frames and validate coordinates
        run: python scripts/integration_smoke.py
