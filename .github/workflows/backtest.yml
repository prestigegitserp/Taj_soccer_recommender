name: Historical walk-forward backtest - real unseen results

on:
  push:
    branches: [main]
    paths:
      - "scripts/backtest_walkforward.py"
      - ".github/workflows/backtest.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  historical-backtest:
    name: Three independent chronological out-of-sample folds
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training tools only in Actions
        run: |
          python -m pip install "tensorflow-cpu==2.19.1" "numpy>=1.26,<2.2"
      - name: Train fresh models on earlier REAL games and score later games
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          OMP_NUM_THREADS: "2"
          TF_NUM_INTEROP_THREADS: "2"
          TF_NUM_INTRAOP_THREADS: "2"
        run: |
          python scripts/backtest_walkforward.py
      - name: Audit saved predictions against real results and fold boundaries
        run: |
          python - <<'PY'
          import json
          p=json.load(open("training/backtest-predictions.json"))
          r=json.load(open("docs/data/backtest.json"))
          rows=p["matches"]
          assert r["schema"]=="taj-walkforward-v1"
          assert len(rows)==r["oos_unique_fixtures"]>=1000
          assert len({x["id"] for x in rows})==len(rows)
          for fold in r["folds"]:
              assert fold["train_through"]<fold["validation_from"]
              assert fold["validation_through"]<fold["test_from"]
              match=[x for x in rows if x["fold"]==fold["fold"]]
              assert len(match)==fold["test_n"]
              assert all(fold["test_from"]<=x["date"]<=fold["test_through"] for x in match)
          for row in rows:
              assert row["outcome"]==(0 if row["score"]["home_goals"]>row["score"]["away_goals"]
                                     else 1 if row["score"]["home_goals"]==row["score"]["away_goals"] else 2)
              for key,pr in row["probabilities"].items():
                  assert len(pr)==3 and all(0<=x<=1 for x in pr) and abs(sum(pr)-1)<.00001
          print("AUDIT PASSED - genuine match outcomes, mutually disjoint tests, complete probabilities")
          print("OOS RESULTS:",r["overall"])
          print("PAIRED UNCERTAINTY:",r["paired_uncertainty"])
          PY
      - name: Commit transparent report plus all match-level predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add -f docs/data/backtest.json training/backtest-predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "results: real unseen walk-forward football backtest and predictions"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
