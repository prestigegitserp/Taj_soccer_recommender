name: Python checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,api,dashboard]"
      - run: python -m compileall -q src dashboard.py
      - run: python scripts/check_frontend.py
      - run: node --check docs/app.mjs
      - run: node --check docs/football-features.mjs
      - run: node --check docs/litert-worker.mjs
      - run: node --check docs/neural-ui.mjs
      - run: node --test tests/test_browser.mjs tests/test_neural.mjs
      - run: pytest -q
      - run: taj demo --out data/demo
      - run: taj analyze --data data/demo --out outputs/report.json
      - run: taj viewer-export --data data/demo --out outputs/viewer.json --max-frames 8
      - run: taj html-export --data data/demo --out outputs/report.html
      - name: Validate JSON notebook and browser payload
        run: |
          python - <<'PY'
          import json,nbformat
          from pathlib import Path
          nb=nbformat.read("notebooks/Taj_Colab.ipynb",as_version=4)
          nbformat.validate(nb)
          v=json.loads(Path("outputs/viewer.json").read_text())
          assert v["format"]=="taj-viewer-v1" and len(v["frames"])==8
          assert Path("outputs/report.html").exists()
          print("Colab notebook, viewer and HTML export: VALID")
          PY
