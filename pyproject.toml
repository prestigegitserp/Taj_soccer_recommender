[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taj-soccer"
version = "0.2.0"
description = "Explainable open-data football spatial intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "pyarrow>=14", "plotly>=5.20", "kloppy>=3.16,<4", "requests>=2.31"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5.9"]
all = ["streamlit>=1.36", "fastapi>=0.110", "uvicorn>=0.27", "pytest>=8", "nbformat>=5.9"]

[project.scripts]
taj = "taj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
